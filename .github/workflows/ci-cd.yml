name: CI/CD Pipeline en Develop

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo del repositorio
      uses: actions/checkout@v4

    - name: Validar sintaxis de Docker Compose
      run: docker compose config || echo "No docker-compose yet"

    - name: Construir imagenes del Microservicio
      run: docker compose build || echo "No Dockerfile yet"

