name: CI/CD Microservice Java Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-security:
    name: Pruebas Unitarias y Análisis de Seguridad (Snyk)
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Ejecutar pruebas unitarias (JUnit)
      run: mvn test

    - name: Ejecutar Snyk para buscar vulnerabilidades en dependencias
      uses: snyk/actions/maven@master
      continue-on-error: false
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high
