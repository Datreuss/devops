name: Pipeline CI/CD Automatizado BibliotecaTecEduAuth

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main ]

jobs:
  Quality-And-Testing:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Código Fuente
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configurar Entorno Java JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: IE7: Ejecución Automatizada de Pruebas Unitarias
        run: mvn test

      - name: IE8/IE13: Análisis Estático de Código (SonarQube)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: mvn sonar:sonar

      - name: IE8: Escaneo de Vulnerabilidades en Dependencias (Snyk)
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  Build-And-Publish:
    needs: Quality-And-Testing
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    steps:
      - name: Clonar Código
        uses: actions/checkout@v3

      - name: Autenticación Segura en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: IE6/IE9: Construcción y Publicación de la Imagen Docker
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/biblioteca-auth:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/biblioteca-auth:${{ github.sha }}
