name: CI-CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-security:
    name: Pruebas y Snyk
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Ejecutar pruebas unitarias
      run: mvn test -DfailIfNoTests=false -Dmaven.test.failure.ignore=true

    - name: Generar Reporte de Dependencias (CycloneDX)
      run: mvn org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom -DskipTests

    - name: Configurar Snyk CLI
      uses: snyk/actions/setup@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}


    - name: Autenticar y Subir reporte a Snyk Web
      run: snyk sbom monitor --file=target/bom.json
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
